<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アカウント編集</title>
    <link rel="stylesheet" href="/css/accountcreate.css" />
  </head>
  <body>
    <a href="/home" class="back-button">← 戻る</a>
    <div class="form-container">
      <h1>アカウント編集</h1>

      <form
        th:action="@{/accountedit}"
        method="post"
        th:object="${accountForm}"
        class="account-form"
      >
        <div th:if="${message}" class="success-message" th:text="${message}"></div>
        <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

        <div class="form-group">
          <label for="user-id">ユーザID</label>
          <input
            type="text"
            id="user-id"
            th:field="*{userId}"
            placeholder="ユーザIDを入力"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">パスワード</label>
          <input
            type="password"
            id="password"
            th:field="*{password}"
            placeholder="パスワードを入力"
            required
          />
        </div>

        <div class="form-group">
          <label for="name">名前</label>
          <input type="text" id="name" th:field="*{name}" placeholder="名前を入力" required />
        </div>

        <div class="form-group">
          <label for="role">権限</label>
          <select id="role" th:field="*{role}" required>
            <option value="" disabled selected>選択してください</option>
            <option value="admin">管理者</option>
            <option value="teacher">講師</option>
            <option value="student">生徒</option>
          </select>
        </div>

        <div class="form-group">
          <label for="grade">学年</label>
          <select id="grade" th:field="*{grade}">
            <option value="" disabled selected>選択してください</option>
            <option value="1">1年</option>
            <option value="2">2年</option>
            <option value="3">3年</option>
            <option value="4">4年</option>
          </select>
        </div>

        <div class="form-group">
          <label for="class">クラス</label>
          <select id="class" th:field="*{classId}">
            <option value="" disabled selected>選択してください</option>
            <option value="R1A1">R1A1</option>
            <option value="R1A2">R1A2</option>
            <option value="R2A1">R2A1</option>
            <option value="R2A2">R2A2</option>
            <option value="R3A1">R3A1</option>
            <option value="R3A2">R3A2</option>
            <option value="R4A1">R4A1</option>
            <option value="R4A2">R4A2</option>

            <option value="S1A1">S1A1</option>
            <option value="S1A2">S1A2</option>
            <option value="S2A1">S2A1</option>
            <option value="S2A2">S2A2</option>
            <option value="S3A1">S3A1</option>
            <option value="S3A2">S3A2</option>

            <option value="J1A1">J1A1</option>
            <option value="J1A2">J1A2</option>
            <option value="J2A1">J2A1</option>
            <option value="J2A2">J2A2</option>

            <option value="G1A1">G1A1</option>
            <option value="G1A2">G1A2</option>
            <option value="G2A1">G2A1</option>
            <option value="G2A2">G2A2</option>
            <option value="G3A1">G3A1</option>
            <option value="G3A2">G3A2</option>

            <option value="M1A1">M1A1</option>
            <option value="M2A1">M2A1</option>
          </select>
        </div>

        <div class="form-group">
          <label for="number">番号</label>
          <input type="number" id="number" th:field="*{number}" />
        </div>

        <input type="hidden" th:field="*{id}" />
        <button type="submit" class="create-button">更新する</button>
      </form>
    </div>
  </body>
</html>

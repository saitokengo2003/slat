<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ホーム</title>

    <link rel="icon" th:href="@{/images/logo.png}" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- ✅ カスタムCSS -->
    <link rel="stylesheet" href="/css/top.css" />
  </head>

  <body>
    <div class="container-fluid p-0 d-flex">
      <!-- ✅ サイドバー -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top px-3 mb-3">
          <button class="menu-btn" id="menu-toggle">☰</button>

          <span th:if="${displayName}" class="user-sidebar-name ms-3">
            <span th:text="${displayName}">ユーザー名</span>
          </span>
        </div>

        <a th:href="@{/groupcreate}" class="create-group-icon">
          <img th:src="@{/images/group_icon.png}" alt="group" class="group-icon-img" />
        </a>

        <a th:href="@{/home}" class="home-btn">
          <span class="home-icon">🏠</span>
          <span class="home-text">ホーム</span>
        </a>

        <p class="menu-title">▼ ダイレクトメッセージ</p>
        <ul class="menu-list">
          <li
            th:each="user : ${otherUsers}"
            class="user-list-item"
            th:data-user-id="${user.userId}"
            th:data-display-name="${user.displayName}"
          >
            <span class="icon" th:text="${#strings.substring(user.displayName, 0, 1)}">A</span>
            <span class="menu-text" th:text="${user.displayName}">ユーザー名</span>
          </li>
        </ul>

        <p class="menu-title">▼ グループ</p>
        <ul class="menu-list">
          <li
            th:each="group : ${generalGroups}"
            class="group-list-item"
            th:data-group-id="${group.id}"
            th:data-display-name="${group.name}"
          >
            <span class="group-icon" th:text="${#strings.substring(group.name, 0, 1)}">G</span>
            <span class="menu-text" th:text="${group.name}">グループ名</span>
          </li>
        </ul>
      </aside>

      <!-- ✅ メインコンテンツ -->
      <main class="main-content">
        <div class="top-bar d-flex justify-content-between align-items-center">
          <form th:action="@{/search}" method="post">
            <input
              type="text"
              class="search-bar"
              name="keyword"
              placeholder="検索"
              th:value="${keyword}"
            />
            <button type="submit" class="search-btn">検索</button>
          </form>

          <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">ログアウト</button>
          </form>
        </div>

        <div class="mt-3">
          <p th:if="${keyword != null}">
            "<span th:text="${keyword}"></span>" の検索結果 (<span
              th:text="${#lists.size(results)}"
            ></span
            >件)
          </p>
        </div>

        <table class="table table-striped" th:if="${results != null}">
          <thead>
            <tr>
              <th>日時</th>
              <th>グループ</th>
              <th>ユーザー</th>
              <th>メッセージ</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${results}">
              <td th:text="${r.createdAt}">2025-11-13 10:00</td>
              <td th:text="${r.groupName}">General</td>
              <td>
                <span th:text="${r.senderDisplayName}">山田太郎</span>
                (<span th:text="${r.senderUsername}">taro</span>)
              </td>
              <td th:text="${r.body}">メッセージ本文</td>
            </tr>
            <tr th:if="${#lists.isEmpty(results)}">
              <td colspan="4">該当するメッセージはありませんでした。</td>
            </tr>
          </tbody>
        </table>

        <h2 class="page-title">ホーム</h2>

        <ul class="chat-list">
          <li>
            <div class="chat-left">
              <span class="chat-icon">T</span>
              <span class="chat-text">チャット内容・・・</span>
            </div>
            <div class="dropdown">
              <button class="dropdown-btn">⋯</button>
              <div class="dropdown-menu">
                <a href="#">編集</a>
                <a href="#">削除</a>
                <a href="#">詳細</a>
              </div>
            </div>
          </li>

          <li>
            <div class="chat-left">
              <span class="chat-icon">ℓ</span>
              <span class="chat-text">チャット内容・・・</span>
            </div>
            <div class="dropdown">
              <button class="dropdown-btn">⋯</button>
              <div class="dropdown-menu">
                <a href="#">編集</a>
                <a href="#">削除</a>
                <a href="#">詳細</a>
              </div>
            </div>
          </li>
        </ul>
        <a href="login">ログイン画面へ</a><br />
        <a href="accountadmin">アカウント管理画面へ</a><br />
        <a href="accountcreate">アカウント作成画面へ</a><br />
        <a href="admin">管理者メニューへ</a><br />
        <a href="groupcreate">グループ作成画面へ</a><br />
        <a href="groupinfo">グループ詳細画面へ</a><br />
        <a href="chat">チャット画面へ</a>
      </main>
    </div>

    <!-- ✅ JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
  </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slat チャットホーム</title>
    <link rel="icon" th:href="@{/images/logo.png}" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/chat.css}" />
  </head>

  <body>
    <div class="container-fluid p-0 d-flex">
      <input type="hidden" id="logged-in-user-id" th:value="${loggedInUserId}" />
      <input type="hidden" id="logged-in-user-role" th:value="${loggedInUserRole}" />

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top px-3 mb-3">
          <button class="menu-btn" id="menu-toggle">☰</button>

          <span th:if="${displayName}" class="user-sidebar-name ms-3">
            <span th:text="${displayName}">ユーザー名</span>
          </span>
        </div>

        <a th:href="@{/groupcreate}" class="create-group-icon">
          <img th:src="@{/images/group_icon.png}" alt="group" class="group-icon-img" />
        </a>

        <a th:href="@{/home}" class="home-btn">
          <span class="home-icon">🏠</span>
          <span class="home-text">ホーム</span>
        </a>

        <p class="menu-title">▼ ダイレクトメッセージ</p>
        <ul class="menu-list">
          <li
            th:each="user : ${otherUsers}"
            class="user-list-item"
            th:data-user-id="${user.userId}"
            th:data-display-name="${user.displayName}"
          >
            <span class="icon" th:text="${#strings.substring(user.displayName, 0, 1)}">A</span>
            <span class="menu-text" th:text="${user.displayName}">ユーザー名</span>
          </li>
        </ul>

        <p class="menu-title">▼ グループ</p>
        <ul class="menu-list">
          <li
            th:each="group : ${generalGroups}"
            class="group-list-item"
            th:data-group-id="${group.id}"
            th:data-display-name="${group.name}"
          >
            <span class="group-icon" th:text="${#strings.substring(group.name, 0, 1)}">G</span>
            <span class="menu-text" th:text="${group.name}">グループ名</span>
          </li>
        </ul>
      </aside>

      <main class="main-content">
        <div class="top-bar d-flex justify-content-between align-items-center">
          <h5 id="chat-partner-name">チャット相手を選択してください</h5>
        </div>

        <div class="chat-area">
          <p class="guide-text">サイドバーからチャット相手を選択すると、履歴が表示されます。</p>
        </div>

        <div class="chat-input-area d-flex align-items-center p-3">
          <input type="text" class="chat-input" placeholder="メッセージを入力してください" />
          <button class="expiration-btn" type="button" title="期限付きメッセージ">🕒</button>
          <button class="send-btn" type="button">➤</button>
        </div>
      </main>
    </div>

    <div
      class="modal fade"
      id="expirationModal"
      tabindex="-1"
      aria-labelledby="expirationModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="expirationModalLabel">📅 メッセージ有効期限の設定</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p>メッセージの有効期限となる日時を指定してください。</p>
            <div class="mb-3">
              <label for="expiryDate" class="form-label">日付 (必須)</label>
              <input type="date" class="form-control" id="expiryDate" required />
            </div>
            <div class="mb-3">
              <label for="expiryTime" class="form-label">時刻 (必須)</label>
              <input type="time" class="form-control" id="expiryTime" required />
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-primary" id="setCustomExpirationBtn">✅ この日時に設定</button>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="editMessageModal"
      tabindex="-1"
      aria-labelledby="editMessageModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editMessageModalLabel">✎ メッセージの編集</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-message-id" />

            <textarea
              class="form-control"
              id="edit-message-body"
              rows="5"
              placeholder="メッセージを入力してください"
            ></textarea>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              キャンセル
            </button>
            <button type="button" class="btn btn-primary" id="saveEditBtn">保存</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
  </body>
</html>

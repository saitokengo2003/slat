<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理者メニュー</title>

    <link rel="icon" th:href="@{/images/logo.png}" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- ✅ カスタムCSS -->
    <link rel="stylesheet" href="/css/admin.css" />
  </head>

  <body>
    <div class="container-fluid p-0 d-flex">
      <!-- ✅ サイドバー -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top px-3 mb-3">
          <button class="menu-btn" id="menu-toggle">☰</button>

          <span th:if="${displayName}" class="user-sidebar-name ms-3">
            <span th:text="${displayName}">ユーザー名</span>
          </span>
        </div>

        <a th:href="@{/groupcreate}" class="create-group-icon">
          <img th:src="@{/images/group_icon.png}" alt="group" class="group-icon-img" />
        </a>

        <a th:href="@{/home}" class="home-btn">
          <span class="home-icon">🏠</span>
          <span class="home-text">ホーム</span>
        </a>
      </aside>

      <!-- ✅ メインコンテンツ -->
      <main class="main-content">
        <div class="top-bar d-flex justify-content-between align-items-center">
          <input type="text" class="search-bar" placeholder="検索" />
        </div>

        <div class="menu-content">
          <h1>管理者メニュー</h1>

          <div class="menu-buttons">
            <a th:href="@{/accountadmin}" button class="admin-btn">アカウント管理</a>
          </div>
        </div>
      </main>
    </div>

    <!-- ✅ JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
  </body>
</html>
